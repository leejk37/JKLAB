<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크롬북 전환 점검</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e2e5eb;
  --accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--skip:#9ca3af;--okbg:#dcfce7;--badbg:#fee2e2;--warnbg:#fef3c7;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:#111827;color:#d1d5db;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:16px;color:#fff;padding:0 16px 12px;margin:0;border-bottom:1px solid #374151}
nav .dev{font-size:12px;color:#9ca3af;padding:8px 16px 0}
nav ol{list-style:none;margin:0;padding:8px 0}
nav li{padding:9px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px}
nav li:hover{background:#1f2937}
nav li.active{background:#2563eb;color:#fff;font-weight:700}
main{padding:24px;max-width:1050px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.stepno{color:var(--accent);font-weight:700;font-size:13px}
h2{margin:2px 0 6px;font-size:22px}
h3{margin:18px 0 8px;font-size:16px}
.desc{color:var(--muted);margin:0 0 16px;font-size:14px;line-height:1.6}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:#9ca3af}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.verdict{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.vlabel{font-weight:700;margin-right:4px}
.verdict .note{flex:1;min-width:220px}
button.pass.on{background:var(--ok);color:#fff;border-color:var(--ok)}
button.fail.on{background:var(--bad);color:#fff;border-color:var(--bad)}
button.skip.on{background:var(--skip);color:#fff;border-color:var(--skip)}
input[type=text],input:not([type]){font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.navbtns{display:flex;justify-content:space-between}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:#f9fafb;width:180px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;background:#f3f4f6;border:1px solid var(--line);font-size:13px}
.chip.done{background:var(--okbg);border-color:#86efac;color:#166534;font-weight:600}
.alert{padding:10px 12px;border-radius:8px;background:var(--warnbg);font-size:14px;margin:8px 0}
.alert.ok{background:var(--okbg)} .alert.bad{background:var(--badbg)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
/* keyboard */
.kb{background:#e5e7eb;padding:10px;border-radius:10px;user-select:none}
.kbrow{display:flex;gap:5px;margin-bottom:5px}
.key{flex:1;min-width:0;height:42px;background:#fff;border:1px solid #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;white-space:nowrap;overflow:hidden;transition:background .1s}
.key.hit{background:#86efac;border-color:#16a34a}
.key.down{background:#16a34a;color:#fff}
.lastkey{margin:10px 0;font-size:14px}
/* touchpad */
.pad{position:relative;height:300px;border:2px dashed #94a3b8;border-radius:12px;background:#f8fafc;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;touch-action:none}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);pointer-events:none}
/* meter */
.meter{height:22px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.meter>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width .05s}
video{width:100%;max-width:560px;border-radius:10px;background:#000}
.overlay{position:fixed;inset:0;z-index:9999;cursor:none}
.overlay .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:14px 18px;border-radius:10px;font-size:16px;cursor:default;transition:opacity .6s}
.mrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow small{color:var(--muted);display:block}
.mrow button{padding:6px 10px}
.big{font-size:28px;font-weight:800}
@media (max-width:760px){.app{grid-template-columns:1fr} nav{position:static;height:auto}}
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>💻 크롬북 전환 점검</h1>
    <div class="dev" id="navDev"></div>
    <ol id="steps"></ol>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ===================== 설정 ===================== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxG6QDSE3gkUkX1uZWjY4_etTZgOLY_llmakyzR_sjAvOLEXfILGiy7ZLp1uwG3MWPnJw/exec',
  TOKEN: 'flex-check-2026'     // Code.gs 의 TOKEN 과 같아야 합니다
};

/* ===================== 상태 저장 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const STORE = 'flexcheck-v1';
const fresh = (tester = '') => ({ info: { assetId: '', model: '', tester }, sys: {}, results: {}, manual: {}, sleepLog: [], startedAt: new Date().toISOString() });
let state = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || fresh(); } catch (e) { return fresh(); } })();
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function res(id) { if (!state.results[id]) state.results[id] = { status: '', note: '', auto: {} }; return state.results[id]; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ===================== 단계 정의 ===================== */
const STEPS = [
  { id: 'info', title: '기기 정보', judged: false, verdict: false, render: renderInfo },
  { id: 'keyboard', title: '키보드', render: renderKeyboard },
  { id: 'touchpad', title: '터치패드', render: renderTouchpad },
  { id: 'display', title: '화면', render: renderDisplay },
  { id: 'speaker', title: '스피커', render: renderSpeaker },
  { id: 'mic', title: '마이크', render: renderMic },
  { id: 'camera', title: '카메라', render: renderCamera },
  { id: 'network', title: '네트워크', render: renderNetwork },
  { id: 'battery', title: '배터리·충전', render: renderBattery },
  { id: 'ports', title: 'USB·외부장치', render: renderPorts },
  { id: 'manual', title: '기타 기능(수동)', verdict: false, render: renderManual },
  { id: 'summary', title: '결과 요약·전송', judged: false, verdict: false, render: renderSummary },
];
const JUDGED = STEPS.filter(s => s.judged !== false);
const ICON = { pass: '✅', fail: '❌', skip: '➖', '': '·' };
const LABEL = { pass: '정상', fail: '이상', skip: '해당없음', '': '미점검' };

let cur = 0, cleanup = null;
function go(i) {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  cur = i; const s = STEPS[i];
  const main = $('#main'); main.innerHTML = '';
  const card = document.createElement('section'); card.className = 'card';
  card.innerHTML = `<div class="stepno">${i} / ${STEPS.length - 1}</div><h2>${s.title}</h2>`;
  const body = document.createElement('div'); card.appendChild(body);
  main.appendChild(card);
  cleanup = s.render(body) || null;
  if (s.verdict !== false) card.appendChild(verdictBox(s.id));
  const nb = document.createElement('div'); nb.className = 'navbtns';
  nb.innerHTML = `<button id="prevBtn" ${i === 0 ? 'disabled' : ''}>← 이전</button><button id="nextBtn" class="primary" ${i === STEPS.length - 1 ? 'disabled' : ''}>다음 →</button>`;
  main.appendChild(nb);
  $('#prevBtn').onclick = () => go(i - 1);
  $('#nextBtn').onclick = () => go(i + 1);
  renderNav(); window.scrollTo(0, 0);
}
function renderNav() {
  $('#navDev').textContent = state.info.assetId ? `관리번호: ${state.info.assetId}` : '관리번호 미입력';
  $('#steps').innerHTML = STEPS.map((s, i) =>
    `<li data-i="${i}" class="${i === cur ? 'active' : ''}"><span>${i}. ${s.title}</span><span>${s.judged === false ? '' : ICON[(state.results[s.id] || {}).status || '']}</span></li>`).join('');
  $('#steps').querySelectorAll('li').forEach(li => li.onclick = () => go(+li.dataset.i));
}
function verdictBox(id) {
  const r = res(id);
  const box = document.createElement('div'); box.className = 'verdict';
  box.innerHTML = `<span class="vlabel">판정</span>
    <button data-v="pass" class="pass">✅ 정상</button>
    <button data-v="fail" class="fail">❌ 이상</button>
    <button data-v="skip" class="skip">➖ 해당없음</button>
    <input class="note" placeholder="메모 (예: F5 키 안 눌림, 오른쪽 스피커 잡음)">`;
  const note = $('.note', box); note.value = r.note || '';
  const paint = () => box.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === r.status));
  box.querySelectorAll('button').forEach(b => b.onclick = () => { r.status = b.dataset.v; save(); paint(); renderNav(); });
  note.oninput = () => { r.note = note.value; save(); };
  paint(); return box;
}
/* 체크칩 도우미: 자동/수동 체크 항목 */
function chipSet(el, r, items, clickable = false) {
  r.auto.checks = r.auto.checks || {};
  const draw = () => {
    el.innerHTML = items.map(([k, t]) => `<span class="chip ${r.auto.checks[k] ? 'done' : ''}" data-k="${k}" style="${clickable ? 'cursor:pointer' : ''}">${r.auto.checks[k] ? '✔ ' : ''}${t}</span>`).join('');
    if (clickable) el.querySelectorAll('.chip').forEach(c => c.onclick = () => { r.auto.checks[c.dataset.k] = !r.auto.checks[c.dataset.k]; save(); draw(); });
  };
  draw();
  return k => { if (!r.auto.checks[k]) { r.auto.checks[k] = true; save(); draw(); } };
}
function errMsg(e) {
  const m = { NotAllowedError: '권한이 거부되었습니다. 주소창 왼쪽 자물쇠 아이콘에서 권한을 허용하세요.', NotFoundError: '장치를 찾을 수 없습니다. 장치가 없거나 드라이버가 지원되지 않는 상태입니다.', NotReadableError: '장치를 열 수 없습니다. 다른 앱이 사용 중이거나 하드웨어 문제일 수 있습니다.' };
  return `${m[e.name] || '오류가 발생했습니다.'} (${e.name}: ${e.message})`;
}

/* ===================== 0. 기기 정보 ===================== */
function getGPU() {
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    if (!gl) return 'WebGL 사용 불가';
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch (e) { return '확인 불가'; }
}
async function collectSys() {
  const ua = navigator.userAgent;
  const sys = {
    chromeOS: /CrOS/.test(ua),
    crosVersion: (ua.match(/CrOS \S+ ([\d.]+)/) || [])[1] || '',
    chrome: (ua.match(/Chrome\/([\d.]+)/) || [])[1] || '',
    cores: navigator.hardwareConcurrency || '',
    memoryGB: navigator.deviceMemory || '',
    screen: `${screen.width}×${screen.height} (배율 ${devicePixelRatio})`,
    gpu: getGPU(),
    ua
  };
  try { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); sys.storageGB = (e.quota / 1e9).toFixed(1); } } catch (e) {}
  return sys;
}
function renderInfo(body) {
  body.innerHTML = `
    <p class="desc">점검할 기기 정보를 입력하세요. 시스템 정보는 자동으로 수집됩니다.<br>
    CPU·메모리·배터리 수명 같은 내부 하드웨어는 ChromeOS 기본 <b>'진단(Diagnostics)'</b> 앱으로 함께 확인하면 더 정확합니다.</p>
    <div style="background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px">
      <b>↩️ 이전 점검 기록 불러오기</b>
      <p class="desc" style="margin:4px 0 10px">이미 점검한 기기를 다시 점검하거나 지난 결과를 볼 때 사용합니다.</p>
      <div class="row">
        <button id="listBtn">📋 점검한 기기 목록</button>
        <select id="devSel" style="display:none;min-width:300px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px"></select>
        <button id="reBtn" class="primary" style="display:none">불러와서 재점검</button>
        <button id="viewBtn" style="display:none">결과만 보기</button>
      </div>
      <div id="prevMsg" style="margin-top:8px"></div>
    </div>
    ${state.prev ? `<div class="alert">↩️ <b>${esc(state.info.assetId)}</b>의 ${esc(state.prev.date)} 점검 기록을 불러온 상태입니다 (이전 판정: ${esc(state.prev.overall)}).
      ❌·미점검 항목을 다시 점검한 뒤 전송하면 <b>새 기록으로 추가</b>되고, 이전 기록은 시트에 그대로 남습니다.</div>` : ''}
    <div class="row" style="margin-bottom:14px">
      <input id="assetId" placeholder="관리번호 (예: NB-07)" style="width:180px">
      <input id="model" placeholder="제조사·모델명 (예: LG 15N540)" style="width:260px">
      <input id="tester" placeholder="점검자" style="width:140px">
    </div>
    <div id="dupHint"></div>
    <div id="osAlert"></div>
    <h3>자동 수집 정보</h3><table id="sysTable"><tr><td>수집 중…</td></tr></table>`;
  const devSel = $('#devSel', body), reBtn = $('#reBtn', body), viewBtn = $('#viewBtn', body), pmsg = $('#prevMsg', body);
  const dupCheck = () => {
    const d = (deviceCache || []).find(x => x.assetId === state.info.assetId);
    $('#dupHint', body).innerHTML = (d && !state.prev)
      ? `<div class="alert">ℹ️ <b>${esc(d.assetId)}</b>은(는) 이미 ${d.count}회 점검 기록이 있습니다 (마지막 ${esc(d.date)}, ${esc(d.overall)}). 위에서 불러와 재점검할 수 있습니다.</div>` : '';
  };
  ['assetId', 'model', 'tester'].forEach(k => {
    const el = $('#' + k, body); el.value = state.info[k] || '';
    el.oninput = () => { state.info[k] = el.value.trim(); save(); renderNav(); if (k === 'assetId') dupCheck(); };
  });
  const fillSel = list => {
    devSel.innerHTML = '<option value="">기기를 선택하세요</option>' + list.map(d =>
      `<option value="${esc(d.assetId)}">${esc(d.assetId)} · ${esc(d.model || '-')} · ${esc(d.date)} · ${esc(d.overall)} (${d.count}회)</option>`).join('');
    devSel.style.display = reBtn.style.display = viewBtn.style.display = '';
    dupCheck();
  };
  $('#listBtn', body).onclick = async () => {
    pmsg.innerHTML = '<div class="alert">불러오는 중…</div>';
    try {
      const list = await loadDeviceList();
      if (!list.length) { pmsg.innerHTML = '<div class="alert">아직 저장된 점검 기록이 없습니다.</div>'; return; }
      fillSel(list); pmsg.innerHTML = '';
    } catch (e) { pmsg.innerHTML = `<div class="alert bad">❌ ${esc(e.message)}</div>`; }
  };
  const doLoad = async goto => {
    const id = devSel.value;
    if (!id) { alert('불러올 기기를 선택하세요.'); return; }
    if (Object.values(state.results).some(r => r.status) && !confirm('지금 점검 중인 내용이 지워집니다. 불러올까요?')) return;
    pmsg.innerHTML = '<div class="alert">불러오는 중…</div>';
    try { await loadRecord(id); go(goto); }
    catch (e) { pmsg.innerHTML = `<div class="alert bad">❌ ${esc(e.message)}</div>`; }
  };
  reBtn.onclick = () => doLoad(0);
  viewBtn.onclick = () => doLoad(STEPS.length - 1);
  if (deviceCache && deviceCache.length) fillSel(deviceCache);
  collectSys().then(sys => {
    state.sys = sys; save();
    $('#osAlert', body).innerHTML = sys.chromeOS
      ? `<div class="alert ok">✅ ChromeOS 환경에서 실행 중입니다 (플랫폼 ${esc(sys.crosVersion)}).</div>`
      : `<div class="alert">⚠️ 현재 ChromeOS가 아닌 환경입니다. ChromeOS Flex 설치 후 다시 점검해야 정확합니다.</div>`;
    $('#sysTable', body).innerHTML = [
      ['ChromeOS 플랫폼 버전', sys.crosVersion || '-'], ['Chrome 버전', sys.chrome],
      ['CPU 논리 코어 수', sys.cores], ['메모리(대략)', sys.memoryGB ? sys.memoryGB + 'GB (8GB 이상은 8로 표시됨)' : '확인 불가'],
      ['그래픽', sys.gpu], ['화면', sys.screen], ['브라우저 저장 공간(대략)', sys.storageGB ? sys.storageGB + 'GB' : '확인 불가'],
    ].map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('');
  });
}

/* ===================== 1. 키보드 ===================== */
function kbLayout() {
  const L = s => s.split('').map(c => ['Key' + c, c]);
  const F = Array.from({ length: 12 }, (_, i) => ['F' + (i + 1), 'F' + (i + 1)]);
  const D = '1234567890'.split('').map(d => ['Digit' + d, d]);
  return [
    [['Escape', 'Esc', 1.2], ...F, ['Delete', 'Del', 1.2]],
    [['Backquote', '`'], ...D, ['Minus', '-'], ['Equal', '='], ['Backspace', '⌫', 2]],
    [['Tab', 'Tab', 1.5], ...L('QWERTYUIOP'), ['BracketLeft', '['], ['BracketRight', ']'], ['Backslash', '\\', 1.5]],
    [['CapsLock', 'Caps', 1.8], ...L('ASDFGHJKL'), ['Semicolon', ';'], ['Quote', "'"], ['Enter', 'Enter', 2.2]],
    [['ShiftLeft', 'Shift', 2.3], ...L('ZXCVBNM'), ['Comma', ','], ['Period', '.'], ['Slash', '/'], ['ShiftRight', 'Shift', 2.7]],
    [['ControlLeft', 'Ctrl', 1.3], ['MetaLeft', '검색/Win', 1.3], ['AltLeft', 'Alt', 1.3], ['Space', 'Space', 4], ['AltRight', '한/영(R-Alt)', 1.7], ['ControlRight', '한자(R-Ctrl)', 1.7], ['ArrowLeft', '←'], ['ArrowUp', '↑'], ['ArrowDown', '↓'], ['ArrowRight', '→']],
  ];
}
function renderKeyboard(body) {
  const r = res('keyboard');
  const rows = kbLayout();
  const known = new Map(); rows.flat().forEach(([c, l]) => known.set(c, l));
  const pressed = new Set(r.auto.pressed || []), extra = new Set(r.auto.extra || []);
  body.innerHTML = `
    <p class="desc">모든 키를 하나씩 눌러 보세요. 인식된 키는 초록색으로 바뀝니다.<br>
    ChromeOS Flex에서는 F1~F12가 '뒤로/새로고침/밝기' 등으로 동작할 수 있습니다. 이 경우 아래 '추가 감지 키'에 표시되며 정상입니다.
    (검색 키를 누른 채 누르면 F키로 인식됩니다.)</p>
    <div class="kb" id="kb">${rows.map(row => `<div class="kbrow">${row.map(([c, l, w = 1]) => `<div class="key ${pressed.has(c) ? 'hit' : ''}" data-c="${c}" style="flex:${w}">${esc(l)}</div>`).join('')}</div>`).join('')}</div>
    <div class="lastkey">마지막 입력: <span class="mono" id="last">-</span></div>
    <div class="row"><b id="prog"></b><button id="kbReset">초기화</button></div>
    <h3>추가 감지 키 (한/영, 볼륨, 밝기, 상단 행 키 등)</h3><div class="chips" id="extra"></div>
    <h3>아직 안 눌린 키</h3><div class="mono" id="missing" style="color:var(--bad)"></div>`;
  const update = () => {
    const missing = [...known.keys()].filter(c => !pressed.has(c));

    save();
  };

  };

  update();
  return () => { document.removeEventListener('keydown', onDown, true); document.removeEventListener('keyup', onUp, true); };
}

let audioCtx = null;
function actx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function tone(pan, f1 = 440, dur = 1, f2 = null) {
  const c = actx(), o = c.createOscillator(), g = c.createGain(), p = c.createStereoPanner(), t = c.currentTime;
  o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  p.pan.value = pan;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.05);
  g.gain.setValueAtTime(0.3, t + dur - 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(p).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}

    const fs = [...e.target.files];
    r.auto.parts.usb = fs.length ? `USB 파일 ${fs.length}개 읽음` : '';
    $('#uMsg', body).innerHTML = fs.map(f => `<span class="chip done">${esc(f.name)} (${(f.size / 1024).toFixed(0)}KB)</span>`).join(' ');
    brief();
  };
  $('#xBtn', body).onclick = async () => {
    let n = null, txt;
    try { if ('getScreenDetails' in window) { const d = await getScreenDetails(); n = d.screens.length; txt = d.screens.map(s => `${s.label || '화면'} ${s.width}×${s.height}`).join(', '); } } catch (e) {}
    if (n === null) { n = screen.isExtended ? 2 : 1; txt = screen.isExtended ? '확장 화면 감지됨' : '화면 1개'; }
    r.auto.parts.screen = `화면 ${n}개`;
    $('#xMsg', body).textContent = `${n >= 2 ? '✅' : 'ℹ️'} ${n}개 감지 — ${txt}`; brief();
  };
  $('#btBtn', body).onclick = async () => {
    const m = $('#btMsg', body);
    if (!navigator.bluetooth) { m.textContent = '이 브라우저는 블루투스 검색을 지원하지 않습니다.'; return; }
    try {
      if (!(await navigator.bluetooth.getAvailability())) { m.textContent = '❌ 블루투스 어댑터를 찾을 수 없거나 꺼져 있습니다.'; r.auto.parts.bt = '블루투스 없음/꺼짐'; brief(); return; }
      const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
      m.textContent = `✅ 기기 선택됨: ${d.name || '(이름 없음)'}`; r.auto.parts.bt = '블루투스 정상';
    } catch (e) {
      if (e.name === 'NotFoundError' && /cancel/i.test(e.message)) { m.textContent = '✅ 검색 창 열림(어댑터 작동)'; r.auto.parts.bt = '블루투스 어댑터 작동'; }
      else { m.textContent = '❌ ' + e.message; r.auto.parts.bt = '블루투스 오류'; }
    }
    brief();
  };
  brief();
}

/* ===================== 10. 수동 점검 ===================== */
const MANUAL = [
  ['bright', '밝기 조절 키', '밝기 키로 화면 밝기가 바뀜'],
  ['volume', '볼륨·음소거 키', '누르면 화면에 볼륨 표시가 나타남'],
  ['sleep', '덮개 닫기·절전 복귀', '덮개를 닫고 30초 뒤 열면 정상 복귀 (아래 자동 감지 참고)'],
  ['reboot', '재부팅·종료', '전원 메뉴에서 재부팅 시 정상 부팅'],
  ['headset', '이어폰 단자', '이어폰 연결 시 소리가 이어폰으로 전환'],
  ['hdmi', '외부 모니터 출력', 'HDMI 등 연결 시 확장/미러링 정상'],
  ['usbport', '모든 USB 포트', 'USB 마우스·메모리가 각 포트에서 인식'],
  ['wifiauto', 'Wi-Fi 자동 연결', '재부팅 후 Wi-Fi에 자동 연결'],
  ['led', '충전·전원 표시등', '충전기 연결 시 표시등 점등'],
  ['heat', '발열·팬 소음', '10분 사용 후 과열·심한 팬 소음 없음'],
];
function manualStatus() {
  const v = MANUAL.map(([k]) => state.manual[k] || '');
  const r = res('manual');
  r.status = v.includes('fail') ? 'fail' : v.includes('') ? '' : v.every(x => x === 'skip') ? 'skip' : 'pass';
  const fails = MANUAL.filter(([k]) => state.manual[k] === 'fail').map(([, t]) => t);
  r.auto.brief = `${v.filter(Boolean).length}/${MANUAL.length}항목 확인` + (fails.length ? ` (이상: ${fails.join(', ')})` : '');
  save();
}
function renderManual(body) {
  body.innerHTML = `
    <p class="desc">웹앱이 직접 확인할 수 없는 항목입니다. 직접 해 보고 각 항목을 판정하세요.</p>
    <div id="sleepBox"></div><div id="mList"></div>`;
  const drawSleep = () => {
    const L = state.sleepLog || [];
    $('#sleepBox', body).innerHTML = L.length
      ? `<div class="alert ok">💤 화면 정지(절전 추정) 후 복귀 감지: ${L.slice(-3).map(x => `${esc(x.at)} (${x.sec}초)`).join(', ')}</div>`
      : `<div class="alert">💤 이 화면을 켜 둔 채로 덮개를 닫았다 열면 복귀가 자동 기록됩니다.</div>`;
  };
  const list = $('#mList', body);
  list.innerHTML = MANUAL.map(([k, t, d]) => `<div class="mrow" data-k="${k}"><div><b>${t}</b><small>${d}</small></div>
    <div class="row"><button data-v="pass" class="pass">✅</button><button data-v="fail" class="fail">❌</button><button data-v="skip" class="skip">➖</button></div></div>`).join('');
  const paint = () => list.querySelectorAll('.mrow').forEach(row => row.querySelectorAll('button').forEach(b => b.classList.toggle('on', state.manual[row.dataset.k] === b.dataset.v)));
  list.querySelectorAll('.mrow').forEach(row => row.querySelectorAll('button').forEach(b => b.onclick = () => {
    state.manual[row.dataset.k] = b.dataset.v; manualStatus(); paint(); renderNav();
  }));
  const note = document.createElement('div'); note.className = 'verdict';
  note.innerHTML = `<span class="vlabel">메모</span><input class="note" placeholder="수동 점검 관련 메모">`;
  body.appendChild(note);
  const ni = $('.note', note); ni.value = res('manual').note || ''; ni.oninput = () => { res('manual').note = ni.value; save(); };
  drawSleep(); paint();
  onSleep = drawSleep;
  return () => { onSleep = null; };
}
/* 절전 복귀 감지: 타이머가 오래 멈췄다가 다시 돌면 기록 */
let lastTick = Date.now(), onSleep = null;
setInterval(() => {
  const now = Date.now(), gap = now - lastTick; lastTick = now;
  if (gap > 15000) {
    state.sleepLog = state.sleepLog || [];
    state.sleepLog.push({ at: new Date(now).toLocaleTimeString('ko-KR'), sec: Math.round(gap / 1000) }); save();
    onSleep && onSleep();
  }
}, 2000);

/* ===================== 11. 요약·전송 ===================== */
function overall() {
  const st = JUDGED.map(s => (state.results[s.id] || {}).status || '');
  if (st.includes('fail')) return '이상 있음';
  if (st.includes('')) return '점검 미완료';
  return '합격';
}
function payload() {
  return {
    token: CONFIG.TOKEN, sentAt: new Date().toISOString(), startedAt: state.startedAt,
    info: state.info, sys: state.sys, overall: overall(),
    steps: JUDGED.map(s => { const r = state.results[s.id] || {}; return { id: s.id, title: s.title, status: r.status || '', note: r.note || '', brief: (r.auto || {}).brief || '' }; }),
    manual: state.manual, sleepLog: state.sleepLog,
    previous: state.prev || null
  };
}
function renderSummary(body) {
  manualStatus();
  const o = overall();
  const cls = o === '합격' ? 'ok' : o === '이상 있음' ? 'bad' : '';
  body.innerHTML = `
    <div class="alert ${cls}" style="font-size:18px"><b>종합 판정: ${o}</b> ${state.info.assetId ? `· ${esc(state.info.assetId)}` : ''} ${state.info.model ? `· ${esc(state.info.model)}` : ''}</div>
    ${state.prev ? `<div class="mono" style="color:var(--muted)">↩️ 불러온 기록: ${esc(state.prev.date)} 점검 (당시 판정: ${esc(state.prev.overall)}) · [이전] 표시는 그때의 측정값입니다.</div>` : ''}
    <table style="margin:12px 0"><tr><th>항목</th><th style="width:90px">판정</th><th style="width:auto">측정·메모</th></tr>
    ${JUDGED.map(s => { const r = state.results[s.id] || {}; return `<tr><td>${s.title}</td><td>${ICON[r.status || '']} ${LABEL[r.status || '']}</td><td>${esc((r.auto || {}).brief || '')}${r.note ? `<br><b>메모:</b> ${esc(r.note)}` : ''}</td></tr>`; }).join('')}
    </table>
    <div class="row">
      <button class="primary" id="sendBtn">📤 시트로 전송</button>
      <button id="csvBtn">⬇️ CSV 저장</button>
      <button id="newBtn">🔄 다음 기기 점검</button>
    </div>
    <div id="sendMsg" style="margin-top:10px"></div>`;
  $('#sendBtn', body).onclick = sendResult;
  $('#csvBtn', body).onclick = () => {
    const p = payload(), q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['관리번호', '모델', '점검자', '항목', '판정', '측정', '메모'].map(q).join(',')]
      .concat(p.steps.map(s => [p.info.assetId, p.info.model, p.info.tester, s.title, LABEL[s.status], s.brief, s.note].map(q).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv' }));
    a.download = `점검_${p.info.assetId || '기기'}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  };
  $('#newBtn', body).onclick = () => {
    if (!confirm('현재 기록을 지우고 새 기기 점검을 시작할까요? (전송했는지 먼저 확인하세요)')) return;
    state = fresh(state.info.tester); save(); go(0);
  };
}
async function sendResult() {
  const msg = $('#sendMsg');
  if (!CONFIG.GAS_URL) { msg.innerHTML = '<div class="alert bad">CONFIG.GAS_URL 이 비어 있습니다. index.html 상단에 GAS 배포 URL을 입력하세요.</div>'; return; }
  if (!state.info.assetId) { alert('기기 정보에서 관리번호를 먼저 입력하세요.'); go(0); return; }
  const body = JSON.stringify(payload());
  msg.innerHTML = '<div class="alert">전송 중…</div>';
  try {
    const r = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    const j = await r.json();
    msg.innerHTML = j.ok ? `<div class="alert ok">✅ 시트 ${j.row}행에 저장되었습니다.</div>` : `<div class="alert bad">❌ 저장 실패: ${esc(j.error)}</div>`;
  } catch (e) {
    try {
      await fetch(CONFIG.GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      msg.innerHTML = '<div class="alert">📤 전송했습니다(응답 확인 불가). 시트에서 저장 여부를 확인하세요.</div>';
    } catch (e2) { msg.innerHTML = `<div class="alert bad">❌ 전송 실패: ${esc(e2.message)} — CSV로 저장해 두세요.</div>`; }
  }
}

/* ===================== 이전 기록 조회 ===================== */
let deviceCache = null;
async function gasGet(params) {
  if (!CONFIG.GAS_URL) throw new Error('CONFIG.GAS_URL 이 비어 있습니다.');
  const u = new URL(CONFIG.GAS_URL);
  Object.entries({ ...params, token: CONFIG.TOKEN }).forEach(([k, v]) => u.searchParams.set(k, v));
  let j;
  try { j = await (await fetch(u.toString())).json(); }
  catch (e) { throw new Error('서버에 연결할 수 없습니다. GAS를 새 버전으로 다시 배포했는지 확인하세요.'); }
  if (!j.ok) throw new Error(j.error || '요청 실패');
  return j;
}
async function loadDeviceList() { deviceCache = (await gasGet({ action: 'list' })).devices || []; return deviceCache; }
async function loadRecord(assetId) {
  const { record } = await gasGet({ action: 'get', assetId });
  const d = record.data || {};
  const tester = state.info.tester;
  state = fresh(tester);
  state.info.assetId = (d.info && d.info.assetId) || assetId;
  state.info.model = (d.info && d.info.model) || '';
  state.prev = { date: record.date, overall: d.overall || '', row: record.row };
  (d.steps || []).forEach(s => {
    state.results[s.id] = { status: s.status || '', note: s.note || '', auto: { brief: s.brief ? '[이전] ' + s.brief : '' } };
  });
  state.manual = d.manual || {};
  save();
}

/* ===================== 시작 ===================== */
if (!state.sys.chrome) collectSys().then(s => { state.sys = s; save(); });
go(0);
</script>
